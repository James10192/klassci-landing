name: Qualité

# Les garde-fous SEO tournent ici parce qu'ils ne servent à rien s'ils ne
# tournent que quand on y pense. Quatre pannes ont coexisté en production sans
# qu'aucune ne déclenche d'erreur : un sitemap dont les trente-deux adresses
# étaient invalides, un robots.txt dont la directive Sitemap était coupée en
# deux, vingt-quatre pages de documentation qui se déclaraient doublons de
# l'accueil, et un motif Disallow qui fermait au crawl la meilleure page du
# site. Aucune n'aurait été rattrapée par un test unitaire.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Lundi 6 h UTC : le contrôle des sources citées, qui n'a de sens que
    # répété — un lien meurt sans prévenir, et l'article ne change pas.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # 22 et non 20 : `--experimental-strip-types` n'existe qu'a partir de
          # Node 22.6, et trois verificateurs eprouvent des modules TypeScript
          # sans passer par un lanceur de tests. Node 20 est de toute facon
          # deprecie sur les runners GitHub.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typage
        run: pnpm tsc

      - name: Amortisseur du relais
        run: node --experimental-strip-types --conditions=react-server scripts/verifier-amortisseur.mjs

      - name: Identité des écoles servie par la vitrine
        run: node --experimental-strip-types --conditions=react-server scripts/verifier-identite-ecoles.mjs

      - name: Règle de recherche du sélecteur d'établissement
        run: node --experimental-strip-types scripts/verifier-recherche.mjs

      - name: Contrôles SEO sur le dépôt
        run: node scripts/verifier-seo.mjs

      # Quatre pages institutionnelles ont été servies en ligne avec, à l'écran,
      # un encadré adressé à la direction : « les éléments suivants doivent être
      # fournis avant la mise en ligne ». Rien ne regardait le texte servi.
      - name: Aucune note interne servie au public
        run: node scripts/verifier-notes-internes.mjs

      - name: Aucun traceur depose sans accord
        run: node scripts/verifier-traceurs.mjs

      - name: Construction
        run: pnpm build
        env:
          # L'adresse sert au sitemap, aux canoniques et au graphe. On la pose
          # ici pour que la vérification porte sur les mêmes adresses qu'en
          # production — et `lib/site-url.ts` la nettoie de toute façon.
          NEXT_PUBLIC_SITE_URL: https://www.klassci.com

      - name: Données structurées des pages construites
        run: node scripts/verifier-donnees-structurees.mjs

      - name: Budget de performance
        run: node scripts/verifier-budget.mjs

  # Ce que seul un vrai navigateur peut dire.
  #
  # Ces deux contrôles existaient déjà mais ne tournaient nulle part : ils
  # demandent un site en marche, donc ils ne partaient qu'à la main, donc
  # presque jamais. C'est exactement ce que le dépôt s'était reproché en
  # branchant le contrôle des notes internes — un garde-fou qui ne tourne que
  # sur la machine de celui qui l'a écrit ne garde rien.
  #
  # Ils ont leur propre tâche parce qu'ils coûtent une construction ET un
  # serveur, et qu'un échec de l'un ne doit pas masquer l'autre.
  navigateur:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      # La version est epinglee comme dans la tache `verifier` : `package.json`
      # ne declare pas `packageManager`, donc l'action ne peut pas la deduire.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Construction
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.klassci.com

      - name: Demarrer le site
        run: |
          pnpm start -p 3100 &
          # Attendre qu'il reponde plutot que de dormir un temps arbitraire :
          # un `sleep` trop court rend seize echecs illisibles.
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3100/fr && exit 0
            sleep 2
          done
          echo "le site n'a pas repondu en 80 secondes"; exit 1

      - name: Accessibilite (axe-core, WCAG 2.1 A et AA)
        run: node scripts/verifier-accessibilite.mjs

      - name: La navigation se comporte-t-elle comme prevu ?
        run: node scripts/verifier-navigation.mjs

  # Séparé du portail : ce contrôle dépend du réseau et de sites tiers. Une
  # panne chez le CAMES ou un pare-feu qui refuse un centre de données ne doit
  # pas empêcher un déploiement. Il tourne donc seul, chaque lundi, et son
  # échec se lit dans l'onglet Actions sans rien bloquer.
  citations:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Les sources citées répondent-elles encore ?
        run: node scripts/verifier-citations.mjs
