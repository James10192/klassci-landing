name: Captures RDV presentation

on:
  push:
    branches:
      - feat/portail-rdv-multicanal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      REINSCRIPTION_TENANTS: presentation
      REINSCRIPTION_SECRET_PRESENTATION: capture-ci-presentation-000000000000000000000000
      REINSCRIPTION_BASE_PRESENTATION: https://presentation.klassci.com
      REINSCRIPTION_LABEL_PRESENTATION: KLASSCI — Présentation
      DEMONSTRATION_INSCRIPTION_OUVERTE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Installer Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Construire la branche
        run: pnpm build

      - name: Démarrer le site local de capture
        run: |
          pnpm start -p 3100 > /tmp/klassci-rdv.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:3100/fr/inscription/universite/presentation/rendez-vous; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/klassci-rdv.log
          echo "Le portail RDV n'a pas répondu dans le délai imparti."
          exit 1

      - name: Capturer desktop et mobile
        run: node scripts/capturer-rdv.mjs

      - name: Publier les captures
        uses: actions/upload-artifact@v4
        with:
          name: rdv-presentation-captures
          path: .playwright-mcp/rdv-presentation-*.png
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
