name: Live E2E presentation

on:
  push:
    branches:
      - test/live-e2e-presentation-20260928
    paths:
      - .github/workflows/live-e2e-presentation.yml
      - scripts/live-e2e-presentation.mjs

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Installer Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Tester les parcours live
        run: node scripts/live-e2e-presentation.mjs

      - name: Publier captures et rapport
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-presentation
          path: live-e2e-presentation/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
