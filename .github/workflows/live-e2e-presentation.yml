name: Live E2E presentation

on:
  push:
    branches:
      - test/live-e2e-presentation-20260928
    paths:
      - .github/workflows/live-e2e-presentation.yml

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Installer Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Tester les parcours live
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';
          import { mkdir, writeFile } from 'node:fs/promises';

          const BASE = 'https://www.klassci.com';
          const OUT = 'live-e2e-presentation';
          await mkdir(OUT, { recursive: true });

          const rapport = { startedAt: new Date().toISOString(), base: BASE, etapes: [] };
          const browser = await chromium.launch({ headless: true });

          async function attendre(page, ms = 1200) {
            await page.waitForTimeout(ms);
            try { await page.waitForLoadState('networkidle', { timeout: 6000 }); } catch {}
          }

          async function journal(page, nom) {
            const info = await page.evaluate(() => ({
              url: location.href,
              title: document.title,
              h1: document.querySelector('h1')?.textContent?.trim() ?? null,
              h2: [...document.querySelectorAll('h2')].map((e) => e.textContent?.trim()).filter(Boolean),
              buttons: [...document.querySelectorAll('main button')].map((e) => ({ text: e.textContent?.trim(), disabled: e.disabled })),
              inputs: [...document.querySelectorAll('main input')].map((e) => ({
                type: e.type,
                value: e.value,
                placeholder: e.placeholder,
                label: e.labels?.[0]?.textContent?.trim() ?? null,
              })),
              selects: [...document.querySelectorAll('main select')].map((e) => ({
                label: e.labels?.[0]?.textContent?.trim() ?? null,
                value: e.value,
                options: [...e.options].map((o) => o.textContent?.trim()).filter(Boolean),
              })),
              text: document.querySelector('main')?.innerText?.slice(0, 5000) ?? '',
            }));
            rapport.etapes.push({ nom, ...info });
            console.log(`\n===== ${nom} =====`);
            console.log(JSON.stringify(info, null, 2));
            return info;
          }

          async function cliquerTexte(page, regex, fallbackIndex = null) {
            const boutons = page.locator('main button:visible');
            const n = await boutons.count();
            for (let i = 0; i < n; i++) {
              const b = boutons.nth(i);
              const texte = ((await b.innerText().catch(() => '')) || '').trim();
              if (regex.test(texte)) {
                await b.click();
                return texte;
              }
            }
            if (fallbackIndex !== null && n > fallbackIndex) {
              const b = boutons.nth(fallbackIndex);
              const texte = ((await b.innerText().catch(() => '')) || '').trim();
              await b.click();
              return texte;
            }
            throw new Error(`Bouton introuvable: ${regex}`);
          }

          async function remplirParLabel(page, regex, valeur, occurrence = 0) {
            const loc = page.getByLabel(regex);
            const n = await loc.count();
            if (n <= occurrence) throw new Error(`Champ introuvable: ${regex} occurrence ${occurrence}`);
            await loc.nth(occurrence).fill(valeur);
          }

          // 1) Nouvelle candidature LIVE, sans interception réseau.
          {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            page.on('response', (r) => {
              if (r.url().includes('/api/')) console.log('API', r.status(), r.request().method(), r.url());
            });
            try {
              await page.goto(`${BASE}/fr/inscription/universite/presentation`, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await attendre(page);
              await page.screenshot({ path: `${OUT}/01-portail-live.png`, fullPage: true });
              await journal(page, 'portail-live');

              await cliquerTexte(page, /nouveau|nouvelle|premi[eè]re/i, 0);
              await attendre(page);
              await page.screenshot({ path: `${OUT}/02-nouvelle-inscription-formulaire-live.png`, fullPage: true });
              await journal(page, 'nouvelle-inscription-formulaire-live');

              await remplirParLabel(page, /^nom/i, 'TEST DEPLOIEMENT');
              await remplirParLabel(page, /pr[eé]nom/i, 'Validation Live');

              const numeriques = page.locator('main input[inputmode="numeric"]:visible');
              if (await numeriques.count() < 3) throw new Error('Champs date de naissance introuvables');
              await numeriques.nth(0).fill('15');
              await numeriques.nth(1).fill('07');
              await numeriques.nth(2).fill('2002');

              await remplirParLabel(page, /t[eé]l[eé]phone/i, '0595459843');
              await remplirParLabel(page, /e-?mail|courriel/i, 'contact@klassci.com');

              const selects = page.locator('main select:visible');
              const countSelects = await selects.count();
              let voeuPose = false;
              for (let i = 0; i < countSelects; i++) {
                const s = selects.nth(i);
                const label = ((await s.evaluate((e) => e.labels?.[0]?.textContent ?? '')) || '').trim();
                if (/fili[eè]re|niveau/i.test(label)) {
                  const values = await s.locator('option').evaluateAll((opts) => opts.map((o) => o.value).filter((v) => v));
                  if (values.length) {
                    await s.selectOption(values[0]);
                    voeuPose = true;
                    break;
                  }
                }
              }
              if (!voeuPose) {
                const labels = page.locator('main label:visible');
                const nl = await labels.count();
                for (let i = 0; i < nl; i++) {
                  const l = labels.nth(i);
                  const txt = ((await l.innerText().catch(() => '')) || '').trim();
                  if (/v[œo]u|souhait|formation/i.test(txt)) {
                    const input = l.locator('input');
                    if (await input.count()) {
                      await input.first().fill('BTS Informatique de Gestion');
                      voeuPose = true;
                      break;
                    }
                  }
                }
              }
              if (!voeuPose) throw new Error('Impossible de renseigner le voeu');

              const checkboxes = page.locator('main input[type="checkbox"]:visible');
              const nc = await checkboxes.count();
              if (nc === 0) throw new Error('Case de consentement introuvable');
              await checkboxes.nth(nc - 1).check();

              await page.screenshot({ path: `${OUT}/03-nouvelle-inscription-remplie-live.png`, fullPage: true });
              await journal(page, 'nouvelle-inscription-remplie-live');

              await cliquerTexte(page, /envoyer.*candidature|envoyer.*demande|soumettre/i);
              await attendre(page, 2500);
              await page.screenshot({ path: `${OUT}/04-nouvelle-inscription-apres-envoi-live.png`, fullPage: true });
              const apres = await journal(page, 'nouvelle-inscription-apres-envoi-live');
              rapport.nouvelleInscription = {
                soumis: true,
                verificationAffichee: /code|confirm|v[ée]rifi/i.test(apres.text),
                url: apres.url,
              };
            } catch (error) {
              rapport.nouvelleInscription = { soumis: false, erreur: String(error?.stack ?? error) };
              console.error('ERREUR NOUVELLE INSCRIPTION', error);
              await page.screenshot({ path: `${OUT}/04-nouvelle-inscription-erreur-live.png`, fullPage: true }).catch(() => {});
              await journal(page, 'nouvelle-inscription-erreur-live').catch(() => {});
            } finally {
              await page.close();
            }
          }

          // 2) Réinscription LIVE sur un étudiant démo prévu par PresentationDemoSeeder.
          {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            page.on('response', (r) => {
              if (r.url().includes('/api/')) console.log('API', r.status(), r.request().method(), r.url());
            });
            try {
              await page.goto(`${BASE}/fr/inscription/universite/presentation`, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await attendre(page);
              await cliquerTexte(page, /d[eé]j[aà]|ancien|r[eé]inscri/i, 1);
              await attendre(page);
              await page.screenshot({ path: `${OUT}/05-reinscription-identification-live.png`, fullPage: true });
              await journal(page, 'reinscription-identification-live');

              await remplirParLabel(page, /matricule/i, 'DEMO90001');
              const numeriques = page.locator('main input[inputmode="numeric"]:visible');
              if (await numeriques.count() < 3) throw new Error('Champs date de naissance réinscription introuvables');
              await numeriques.nth(0).fill('25');
              await numeriques.nth(1).fill('08');
              await numeriques.nth(2).fill('2005');

              const visibles = page.locator('main button:visible:not([disabled])');
              const n = await visibles.count();
              let clique = false;
              for (let i = 0; i < n; i++) {
                const b = visibles.nth(i);
                const txt = ((await b.innerText().catch(() => '')) || '').trim();
                if (/continuer|rechercher|retrouver|v[eé]rifier|voir.*dossier/i.test(txt)) {
                  await b.click(); clique = true; break;
                }
              }
              if (!clique) {
                // Le bouton principal est le premier bouton non désactivé dans la carte.
                await visibles.first().click();
              }

              await attendre(page, 2500);
              await page.screenshot({ path: `${OUT}/06-reinscription-confirmation-live.png`, fullPage: true });
              const etat = await journal(page, 'reinscription-confirmation-live');
              rapport.reinscription = {
                lookupEffectue: true,
                confirmationAffichee: /confirmer|bonjour|r[eé]inscription|scolarit/i.test(etat.text),
                note: 'Arrêt volontaire avant envoi final : le compte démo porte des coordonnées synthétiques et aucune notification ne doit partir vers un numéro non possédé.',
              };
            } catch (error) {
              rapport.reinscription = { lookupEffectue: false, erreur: String(error?.stack ?? error) };
              console.error('ERREUR REINSCRIPTION', error);
              await page.screenshot({ path: `${OUT}/06-reinscription-erreur-live.png`, fullPage: true }).catch(() => {});
              await journal(page, 'reinscription-erreur-live').catch(() => {});
            } finally {
              await page.close();
            }
          }

          // 3) Portail rendez-vous LIVE : vérifie que le backend déployé répond après migration.
          {
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            try {
              await page.goto(`${BASE}/fr/inscription/universite/presentation/rendez-vous`, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await attendre(page, 1800);
              await page.screenshot({ path: `${OUT}/07-rendez-vous-live.png`, fullPage: true });
              const etat = await journal(page, 'rendez-vous-live');
              rapport.rendezVous = { charge: true, url: etat.url };
            } catch (error) {
              rapport.rendezVous = { charge: false, erreur: String(error?.stack ?? error) };
              console.error('ERREUR RDV', error);
              await page.screenshot({ path: `${OUT}/07-rendez-vous-erreur-live.png`, fullPage: true }).catch(() => {});
            } finally {
              await page.close();
            }
          }

          rapport.finishedAt = new Date().toISOString();
          await writeFile(`${OUT}/rapport.json`, JSON.stringify(rapport, null, 2));
          console.log('\nRAPPORT FINAL');
          console.log(JSON.stringify(rapport, null, 2));
          await browser.close();
          NODE

      - name: Publier captures et rapport
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-presentation
          path: live-e2e-presentation/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
