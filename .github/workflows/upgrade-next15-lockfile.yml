name: Synchroniser verrou Next.js 15 (temporaire)

on:
  push:
    branches: [chore/next15-maintenance-lts-20261105]
    paths: [.github/workflows/upgrade-next15-lockfile.yml]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Regenerer pnpm-lock.yaml
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Verifier la resolution figee
        run: pnpm install --frozen-lockfile
      - name: Commit du verrou de cette branche seulement
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Aucun changement'
          else
            git commit -m 'chore: synchroniser le lockfile du helper IP Vercel'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
